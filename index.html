<style>
:root{
  --bg:#eff5f1; --bg2:#e3eef2; --panel:#fff; --ink:#1c2f28; --soft:#5f7a6e; --faint:#93a99f;
  --line:#dbe8e0; --green:#4c9a75; --green-d:#3b7d5e; --green-bg:#e4f1e9;
  --blue:#5f9dbe; --blue-bg:#e6f0f6; --warn-bg:#fdf7e6; --warn-bd:#e7d9a8; --warn-ink:#7a6420;
  --fs:17px; --lh:1.55; --shadow:0 8px 26px rgba(28,47,40,.08);
}
html.dark{ --bg:#0e1714; --bg2:#101d22; --panel:#16241f; --ink:#dfeee6; --soft:#9db5aa; --faint:#6c8479;
  --line:#233a31; --green:#6fc298; --green-d:#8fd4af; --green-bg:#1c3329; --blue:#82b9d8; --blue-bg:#172c35;
  --warn-bg:#2c2718; --warn-bd:#4d4324; --warn-ink:#d8c67e; --shadow:0 8px 26px rgba(0,0,0,.35)}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(160deg,var(--bg),var(--bg2));background-attachment:fixed;color:var(--ink);
  font-family:"Segoe UI","Microsoft YaHei","Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;
  font-size:15px;line-height:1.6;transition:background .25s,color .25s}
a{color:inherit}
button{font-family:inherit}
.top{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:10px;padding:11px 20px;
  background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;gap:9px;cursor:pointer}
.brand b{font-size:19px;letter-spacing:.5px}
.brand span{font-size:11.5px;color:var(--soft)}
.spacer{flex:1}
.btn{background:var(--panel);border:1px solid var(--line);color:var(--ink);border-radius:9px;padding:6px 12px;
  cursor:pointer;font-size:13px;transition:.15s}
.btn:hover{border-color:var(--green);color:var(--green)}
.btn.pri{background:var(--green);border-color:var(--green);color:#fff}
.btn.pri:hover{background:var(--green-d);color:#fff}
.wrap{max-width:1180px;margin:0 auto;padding:26px 22px 70px}
.hero{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:26px 28px;box-shadow:var(--shadow)}
.hero h2{margin:0 0 6px;font-size:30px;letter-spacing:.3px}
.hero p{margin:0 0 16px;color:var(--soft);font-size:13.5px;max-width:70ch}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.chip{font-size:12px;padding:4px 11px;border-radius:20px;background:var(--green-bg);color:var(--green-d)}
.chip.b{background:var(--blue-bg);color:var(--blue)}
.chip.w{background:var(--warn-bg);color:var(--warn-ink);border:1px solid var(--warn-bd)}
.searchbar{display:flex;gap:9px;align-items:center}
.searchbar input{flex:1;padding:11px 14px;border-radius:11px;border:1px solid var(--line);background:var(--bg);
  color:var(--ink);font-size:14px;outline:none}
.searchbar input:focus{border-color:var(--green);box-shadow:0 0 0 3px var(--green-bg)}
.sec{margin:30px 0 12px;display:flex;align-items:baseline;gap:10px}
.sec h3{margin:0;font-size:16px}
.sec small{color:var(--faint);font-size:12px}
.wall{display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:16px}
.acard{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer;
  transition:.18s;box-shadow:var(--shadow)}
.acard:hover{transform:translateY(-3px);border-color:var(--green)}
.acard img{display:block;width:100%;aspect-ratio:1;object-fit:cover;background:var(--green-bg)}
.acard .nocover{width:100%;aspect-ratio:1;display:grid;place-items:center;background:var(--green-bg);
  color:var(--faint);font-size:13px}
.acard .body{padding:10px 12px 12px}
.acard .nm{font-size:13.5px;font-weight:600;line-height:1.35;height:2.7em;overflow:hidden}
.acard .mt{display:flex;justify-content:space-between;color:var(--faint);font-size:11.5px;margin-top:5px}
.tag{font-size:10.5px;padding:1px 7px;border-radius:10px;background:var(--blue-bg);color:var(--blue)}
.rows{display:flex;flex-direction:column;gap:9px}
.srow{display:flex;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);
  border-radius:11px;padding:9px 13px;cursor:pointer;transition:.15s}
.srow:hover{border-color:var(--green);transform:translateX(3px)}
.srow img{width:44px;height:44px;border-radius:8px;object-fit:cover;flex:0 0 44px}
.srow .t{flex:1;min-width:0}
.srow .t b{display:block;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srow .t small{color:var(--faint);font-size:11.5px}
.srow .r{color:var(--faint);font-size:11.5px;white-space:nowrap}
.grid2{display:grid;grid-template-columns:250px 1fr;gap:22px;align-items:start}
.side{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--shadow);
  position:sticky;top:70px;max-height:calc(100vh - 88px);overflow:auto;scrollbar-width:thin}
.side img{width:100%;border-radius:10px;display:block;aspect-ratio:1;object-fit:cover}
.side .an{font-size:13.5px;font-weight:600;margin:10px 0 2px}
.side .ad{font-size:11.5px;color:var(--faint);margin-bottom:10px}
.side .tr{display:flex;gap:7px;padding:6px 8px;border-radius:8px;cursor:pointer;font-size:12.5px;align-items:center}
.side .tr:hover{background:var(--green-bg)}
.side .tr.on{background:var(--green);color:#fff}
.side .tr .n{color:var(--faint);font-size:11px;width:16px;flex:0 0 16px}
.side .tr.on .n{color:#dff0e7}
.side .tr .star{margin-left:auto;opacity:.55}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px 24px 26px;box-shadow:var(--shadow)}
.songhead h2{margin:0;font-size:25px;line-height:1.3}
.metaline{display:flex;gap:8px;flex-wrap:wrap;margin:9px 0 0}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:14px 0 4px;padding-top:13px;border-top:1px dashed var(--line)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{background:var(--panel);border:0;padding:6px 11px;font-size:12.5px;cursor:pointer;color:var(--soft)}
.seg button.on{background:var(--green);color:#fff}
.warn{margin:11px 0 0;font-size:12.5px;padding:9px 12px;border-radius:9px;border:1px solid var(--warn-bd);
  background:var(--warn-bg);color:var(--warn-ink)}
.credits{margin:10px 0 0;font-size:11.5px;color:var(--faint);white-space:pre-wrap;line-height:1.75}
.lines{font-size:var(--fs);line-height:var(--lh);margin-top:14px}
.ln{display:grid;grid-template-columns:52px 1fr;gap:10px;padding:8px 8px 8px 4px;border-radius:9px;
  border-bottom:1px dashed color-mix(in srgb,var(--line) 65%,transparent)}
.ln:hover{background:var(--green-bg)}
.ln.act{background:var(--green-bg);box-shadow:inset 3px 0 0 var(--green)}
.ln.act .org{color:var(--green-d);font-weight:600}
.ts{font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums;padding-top:6px;cursor:pointer}
.ts:hover{color:var(--green)}
html.no-ts .ts{display:none}
html.no-ts .ln{grid-template-columns:1fr}
.org{color:var(--ink)}
.rom{color:var(--blue);font-size:.85em;margin-top:3px}
.trn{color:var(--soft);margin-top:3px}
.player{margin-top:14px;background:var(--blue-bg);border:1px solid var(--line);border-radius:11px;padding:11px 13px}
.player audio{display:none}
/* 播放器住在左侧信息卡下面，不用浏览器原生的 <audio controls>，自绘一条紧凑播放条。两个原因：
   ① 那一列只有 250px，扣掉卡片和播放器内边距后原生播放条只剩约 202px，进度条会缩成一小截
     （Edge 无头截图逐档量过：200px 几乎没法拖，288px 才开始像样）；
   ② 原生控件右侧那个 ⋮（"更多选项"）没法用 CSS 关掉——::-webkit-media-controls-overflow-button
     在新版 Chromium 已完全无效；用 controlsList 得把"倍速""下载"全关掉菜单才会空掉消失，
     而 headless Chrome 的菜单里根本没有"下载"项，拿它验证会得出"只关倍速就够了"的错结论。
   不挂 controls 就一了百了：所有浏览器都不会再有 ⋮，宽度也自己说了算。 */
.side .player{display:flex;gap:9px;align-items:center;margin:12px 0 0;padding:10px}
.side .pp{flex:0 0 30px;width:30px;height:30px;border:none;border-radius:50%;background:var(--green);color:#fff;
  font-size:11px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0 0 0 2px}
.side .pp:active{transform:scale(.94)}
.side .mid{flex:1 1 auto;min-width:0}
.side #sk{width:100%;display:block;margin:0;height:16px;accent-color:var(--green);cursor:pointer}
.side #sk:disabled{opacity:.4;cursor:default}
.side .tm{font-size:10.5px;color:var(--faint);text-align:right;font-variant-numeric:tabular-nums;line-height:1.3}
.noaudio{margin-top:14px;font-size:12.5px;color:var(--faint);border:1px dashed var(--line);border-radius:11px;padding:11px 13px}
.drawer{position:fixed;right:14px;top:60px;width:288px;max-height:calc(100vh - 80px);overflow:auto;background:var(--panel);
  border:1px solid var(--line);border-radius:13px;padding:16px;box-shadow:0 14px 40px rgba(0,0,0,.16);z-index:50;display:none}
.drawer.open{display:block}
.drawer h4{margin:0 0 11px;font-size:12.5px;color:var(--soft);font-weight:600}
.row{margin-bottom:13px}
.row>label{display:block;font-size:11.5px;color:var(--faint);margin-bottom:5px}
.chks{display:flex;flex-direction:column;gap:6px}
.chks label{display:flex;align-items:center;gap:8px;font-size:13px;margin:0;cursor:pointer}
input[type=range]{width:100%;accent-color:var(--green)}
.kbd{font-size:11.5px;color:var(--faint);border-top:1px dashed var(--line);padding-top:10px;line-height:1.9}
kbd{background:var(--bg);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;font-size:11px}
.snip{font-size:12.5px;color:var(--soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
mark{background:color-mix(in srgb,var(--green) 26%,transparent);color:inherit;border-radius:3px;padding:0 1px}
.empty{text-align:center;color:var(--faint);padding:44px 0;font-size:13.5px}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);
  padding:9px 18px;border-radius:22px;font-size:13px;opacity:0;transition:.25s;z-index:90;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media (max-width:880px){.grid2{grid-template-columns:1fr}.side{position:static}.hero h2{font-size:23px}
  .wall{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}.wrap{padding:18px 13px 60px}}
/* NCT JNJM 的名字比 TWS 长，430 px 下顶栏三个按钮会被挤出屏幕，这里单独收窄 */
@media (max-width:560px){.top{gap:6px;padding:9px 12px}.brand{gap:6px}.brand b{font-size:16px;letter-spacing:.2px}
  .brand span{display:none}.btn{padding:5px 9px;font-size:12px}}
</style>
</head>
<body>
<div class="top">
  <div class="brand" id="brand"><b>NCT JNJM</b><span>Lyrics</span></div>
  <span class="spacer"></span>
  <button class="btn" id="bFav">收藏 <small id="favN"></small></button>
  <button class="btn" id="bTheme">主题</button>
  <button class="btn" id="bGear">显示设置</button>
</div>

<div class="wrap" id="view"></div>

<div class="drawer" id="drawer">
  <h4>歌词显示</h4>
  <div class="row"><label>行组模式</label>
    <div class="seg" id="segMode"><button data-m="stack">三行对照</button><button data-m="pair">原文+中译</button><button data-m="single">单行</button></div></div>
  <div class="row"><label>单行模式看哪一行</label>
    <div class="seg" id="segLang"><button data-l="org">原文</button><button data-l="rom">罗马音</button><button data-l="trn">中译</button></div></div>
  <div class="row"><label>内容开关</label><div class="chks">
    <label><input type="checkbox" id="cOrg"> 原文（韩/日/中）</label>
    <label><input type="checkbox" id="cRom"> 罗马音</label>
    <label><input type="checkbox" id="cTrn"> 中文翻译</label>
    <label><input type="checkbox" id="cTs"> 时间戳</label>
    <label><input type="checkbox" id="cAuto"> 播放时自动滚动</label>
    <label><input type="checkbox" id="cImg"> 显示封面图</label></div></div>
  <div class="row"><label>字号 <b id="fsVal"></b></label><input type="range" id="fs" min="13" max="26" step="1"></div>

<script>
const D=JSON.parse(document.getElementById('data').textContent);
const DEF={mode:'stack',lang:'org',org:true,rom:true,trn:true,ts:true,auto:true,img:true,dark:false,fs:17,lh:1.55};
const S=Object.assign({},DEF,JSON.parse(localStorage.getItem('nctjnjm-ui-v2')||'{}'));
let FAV=new Set(JSON.parse(localStorage.getItem('nctjnjm-fav')||'[]'));
let view='home', cur=0, albumFilter=null, audioMap=D.audio||{}, lastQuery='';

const V=()=>document.getElementById('view');
const save=()=>{localStorage.setItem('nctjnjm-ui-v2',JSON.stringify(S));localStorage.setItem('nctjnjm-fav',JSON.stringify([...FAV]));
  const n=document.getElementById('favN'); if(n)n.textContent=FAV.size?'('+FAV.size+')':''};
const esc=t=>String(t==null?'':t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const song=i=>D.songs[i];
const albumOf=s=>D.albums.find(a=>a.id===s.albumId)||{};
const cover=a=>S.img&&a.cover?`<img src="${esc(a.cover)}" alt="" loading="lazy">`:'';
const byId=id=>D.songs.findIndex(s=>s.id===id);
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('show');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('show'),1700)}

/* ---------- 首页 ---------- */
function home(q){
  const latest=D.albums[0];
  const hit=q?search(q):null;
  let body='';
  if(q){
    body=`<div class="sec"><h3>“${esc(q)}” 的搜索结果</h3><small>${hit.length} 条</small></div>`+
      (hit.length?`<div class="rows">${hit.map(r=>`
        <div class="srow" data-go="${r.i}">${coverImg(r.i)}
          <div class="t"><b>${esc(r.s.name)}</b><small>${esc(r.s.album)} · ${esc(r.s.date)}</small>
          <div class="snip">${r.snip}</div></div><span class="r">${esc(r.s.duration)}</span></div>`).join('')}</div>`
        :`<div class="empty">没找到包含这个词的歌词。试试韩文原文、罗马音或中文译词。</div>`);
  }else{
    const years=[...new Set(D.albums.map(a=>a.year))];
    body=years.map(y=>`<div class="sec"><h3>${y} 年</h3><small>${D.albums.filter(a=>a.year===y).length} 张发行</small></div>
      <div class="wall">${D.albums.filter(a=>a.year===y).map(a=>`
        <div class="acard" data-al="${a.id}">${cover(a)}
          <div class="body"><div class="nm">${esc(a.name)}</div>
            <div class="mt"><span class="tag">${esc(a.kind)}</span><span>${a.date.slice(5)} · ${a.count} 首</span></div>
          </div></div>`).join('')}</div>`).join('');
  }
  V().innerHTML=`<div class="hero">
      <h2>${q?'搜索歌词':'NCT JNJM 歌词面板'}</h2>
      <div class="searchbar"><input id="q" placeholder="搜歌名 / 专辑 / 任意一句歌词（韩文、罗马音、中文都行）" value="${esc(q||'')}">
        <button class="btn pri" id="bRand">随机一首</button></div>
      ${!q?`<div class="chips" style="margin-top:12px">
        <span class="chip" data-jump="new" style="cursor:pointer">最新发行：${esc(latest.name)}</span>
        <span class="chip" data-jump="fav" style="cursor:pointer">只看收藏</span>
      </div>`:''}
    </div>${body}`;
  bindHome();
}
function coverImg(i){const a=albumOf(song(i));return S.img&&a.cover?`<img src="${esc(a.cover)}" alt="" loading="lazy">`:''}
function bindHome(){
  V().querySelectorAll('[data-go]').forEach(e=>e.onclick=()=>go(+e.dataset.go));
  V().querySelectorAll('[data-al]').forEach(e=>e.onclick=()=>albumView(+e.dataset.al));
  const q=V().querySelector('#q');
  if(q){q.oninput=()=>{clearTimeout(q._t);q._t=setTimeout(()=>{const v=q.value.trim();lastQuery=v;home(v);const n=V().querySelector('#q');n.focus();n.setSelectionRange(v.length,v.length)},260)}}
  const r=V().querySelector('#bRand'); if(r)r.onclick=()=>go(Math.floor(Math.random()*D.songs.length));
  V().querySelectorAll('[data-jump]').forEach(e=>e.onclick=()=>{
    const k=e.dataset.jump;
    if(k==='new')albumView(D.albums[0].id);
    else if(k==='fav')favView();
    else home('');
  });
}
function albumView(aid){
  const a=D.albums.find(x=>x.id===aid);
  const list=a.songIds.map(byId);
  V().innerHTML=`<div class="sec"><h3>${esc(a.name)}</h3><small>${esc(a.kind)} · ${a.date} · ${a.count} 首</small></div>
    <div class="rows">${list.map(i=>{const s=song(i);return `<div class="srow" data-go="${i}">${coverImg(i)}
      <div class="t"><b>${esc(s.position||'')}. ${esc(s.name)}</b><small>${esc(s.artists)} · ${s.lines.length} 行歌词</small></div>
      <span class="r">${FAV.has(s.id)?'★ ':''}${esc(s.duration)}</span></div>`}).join('')}</div>
    <div class="sec"><button class="btn" data-home="1">← 回首页</button></div>`;
  V().querySelectorAll('[data-go]').forEach(e=>e.onclick=()=>go(+e.dataset.go));
  V().querySelector('[data-home]').onclick=()=>home(lastQuery);
}
function favView(){
  const list=D.songs.map((s,i)=>i).filter(i=>FAV.has(song(i).id));
  V().innerHTML=`<div class="sec"><h3>我的收藏</h3><small>${list.length} 首</small></div>`+
    (list.length?`<div class="rows">${list.map(i=>{const s=song(i);return `<div class="srow" data-go="${i}">${coverImg(i)}
      <div class="t"><b>${esc(s.name)}</b><small>${esc(s.album)} · ${esc(s.date)}</small></div>
      <span class="r">${esc(s.duration)}</span></div>`}).join('')}</div>`
      :`<div class="empty">还没有收藏。在歌词页点 ☆ 或按 F。</div>`)+
    `<div class="sec"><button class="btn" data-home="1">← 回首页</button></div>`;
  V().querySelectorAll('[data-go]').forEach(e=>e.onclick=()=>go(+e.dataset.go));
  V().querySelector('[data-home]').onclick=()=>home('');
}

/* ---------- 歌词页 ---------- */
function warnFor(s){
  const w=[];
  if(s.lines.length&&s.instrumental)w.push('伴奏版，无人声；下面显示的是原曲歌词文本。');
  if(!s.hasTrans&&s.lines.some(l=>l.org))w.push('这首歌暂无中译，显示原文。');
  if(!s.hasRom&&s.lines.some(l=>l.org))w.push('暂无罗马音。');
  return w;
}
function lyricHTML(s){
  if(!s.lines.length)return '<div class="warn">这首歌暂无歌词数据。</div>';
  const showOrg=S.org, showRom=S.rom&&(S.mode==='stack'||S.lang==='rom'), showTrn=S.trn&&(S.mode!=='single'||S.lang==='trn');
  if(S.mode==='single'){
    const key={org:'org',rom:'rom',trn:'trans'}[S.lang];
    if((key==='rom'&&!s.hasRom)||(key==='trans'&&!s.hasTrans))
      return `<div class="warn">这首歌没有${key==='rom'?'罗马音':'中文译文'}，单行模式无内容可显示。换「三行对照」或换一行看。</div>`;
    return s.lines.map((l,n)=>`<div class="ln" data-n="${n}" data-t="${l.t}"><span class="ts">${fmt(l.t)}</span>
      <div class="${S.lang}">${esc(l[key])}</div></div>`).join('');
  }
  return s.lines.map((l,n)=>{
    let inner='';
    if(showOrg&&l.org)inner+=`<div class="org">${esc(l.org)}</div>`;
    if(S.mode==='stack'&&showRom&&l.rom)inner+=`<div class="rom">${esc(l.rom)}</div>`;
    if(showTrn&&l.trans)inner+=`<div class="trn">${esc(l.trans)}</div>`;
    if(!inner)return '';
    return `<div class="ln" data-n="${n}" data-t="${l.t}"><span class="ts">${fmt(l.t)}</span><div>${inner}</div></div>`;
  }).join('');
}
function songView(){
  const s=song(cur), a=albumOf(s);
  const mates=(a.songIds||[]).map(byId);
  const file=audioMap[s.id];
  V().innerHTML=`<div class="grid2">
    <div class="side">${cover(a)}<div class="an">${esc(a.name||s.album)}</div>
      <div class="ad">${esc(a.kind||'')} · ${esc(s.date)} · ${a.count||''} 首</div>
      ${mates.map(i=>{const m=song(i);return `<div class="tr ${i===cur?'on':''}" data-go="${i}">
        <span class="n">${esc(m.position||'')}</span><span>${esc(m.name)}</span><span class="star">${FAV.has(m.id)?'★':'☆'}</span></div>`}).join('')}
      <div class="ad" style="margin-top:10px"><button class="btn" data-home="1" style="width:100%">← 回首页</button></div>
      ${file?`<div class="player" title="${esc(file)}">
          <button class="pp" id="bPlay" aria-label="播放 / 暂停">▶</button>
          <div class="mid"><input type="range" id="sk" min="0" max="0" step="0.1" value="0" disabled>
            <div class="tm"><span id="tCur">00:00</span> / <span id="tDur">${esc(s.duration||'--:--')}</span></div></div>
        <audio id="au" preload="metadata" src="${D.apx}${String(file).split('/').map(encodeURIComponent).join('/')}"></audio></div>`
        :D.static?'':`<div class="noaudio">把音频放进 <b>audio/</b> 文件夹即可自动匹配，匹配后开启逐行高亮。</div>`}</div>
    <div class="panel">
      <div class="songhead"><h2>${esc(s.name)}</h2>
        <div class="metaline"><span class="chip">${esc(s.album)}</span><span class="chip">${esc(s.date)}</span>
        <span class="chip b">${esc(s.duration)}</span><span class="chip b">${s.lines.length} 行</span>
        <span class="chip">${esc(s.artists)}</span>${FAV.has(s.id)?'<span class="chip w">已收藏</span>':''}</div>
        ${warnFor(s).map(x=>`<div class="warn">${esc(x)}</div>`).join('')}
        ${s.meta.length?`<div class="credits">${esc(s.meta.join('\n'))}</div>`:''}
        ${s.translator?`<div class="credits">译文贡献：${esc(s.translator)}</div>`:''}</div>
      <div class="tools">
        <div class="seg" id="segMode2"><button data-m="stack">三行对照</button><button data-m="pair">原文+中译</button><button data-m="single">单行</button></div>
        <button class="btn" id="bStar">${FAV.has(s.id)?'★ 已收藏':'☆ 收藏'}</button>
        <button class="btn" id="bCopy">复制歌词</button>
        <button class="btn" id="bPrevA" ${cur<=0?'disabled':''}>← 上一首</button>
        <button class="btn" id="bNextA" ${cur>=D.songs.length-1?'disabled':''}>下一首 →</button>
      </div>
      <div class="lines" id="lines">${lyricHTML(s)}</div>
    </div></div>`;
  V().querySelectorAll('[data-go]').forEach(e=>e.onclick=()=>go(+e.dataset.go));
  V().querySelector('[data-home]').onclick=()=>home(lastQuery);
  V().querySelectorAll('#segMode2 button').forEach(b=>b.onclick=()=>{S.mode=b.dataset.m;save();sync();songView()});
  V().querySelector('#bStar').onclick=toggleFav;
  V().querySelector('#bCopy').onclick=copyLyric;
  V().querySelector('#bPrevA').onclick=()=>go(cur-1);
  V().querySelector('#bNextA').onclick=()=>go(cur+1);
  V().querySelectorAll('.ts').forEach(e=>e.onclick=()=>{const au=V().querySelector('#au');
    if(au){au.currentTime=+e.parentElement.dataset.t;au.play()}else{e.parentElement.scrollIntoView({block:'center'})}});
  bindAudio();
  document.title=s.name+' · NCT JNJM Lyrics';
}
function bindAudio(){
  const au=V().querySelector('#au'); if(!au)return;
  const s=song(cur);
  const pp=V().querySelector('#bPlay'), sk=V().querySelector('#sk'),
        tCur=V().querySelector('#tCur'), tDur=V().querySelector('#tDur');
  // 播放条是自绘的，所以状态一律从 audio 元素的事件反向同步：空格键、点歌词时间戳
  // 这些入口都只改 au，按钮图标跟着 play/pause 走，不会出现"在放但显示暂停"。
  const paint=()=>{if(pp)pp.textContent=au.paused?'▶':'❚❚'};
  au.addEventListener('timeupdate',()=>{
    const t=au.currentTime; let n=-1;
    for(let i=0;i<s.lines.length;i++) if(s.lines[i].t<=t+0.25) n=i;
    const old=V().querySelector('.ln.act'); if(old)old.classList.remove('act');
    if(n>=0){const el=V().querySelector(`.ln[data-n="${n}"]`);
      if(el){el.classList.add('act'); if(S.auto&&!el._offscreen)el.scrollIntoView({block:'center',behavior:'smooth'})}}
    if(sk&&!sk.dataset.drag)sk.value=t;
    if(tCur&&!sk?.dataset.drag)tCur.textContent=fmt(t);
  });
  au.addEventListener('loadedmetadata',()=>{
    if(sk){sk.max=au.duration||0; sk.disabled=false}
    if(tDur)tDur.textContent=fmt(au.duration||0);
  });
  au.addEventListener('play',paint); au.addEventListener('pause',paint);
  if(pp)pp.onclick=()=>{au.paused?au.play():au.pause()};
  if(sk){
    sk.onpointerdown=()=>{sk.dataset.drag='1'};
    sk.oninput=()=>{if(tCur)tCur.textContent=fmt(+sk.value)};
    const drop=()=>{au.currentTime=+sk.value; delete sk.dataset.drag};
    sk.onchange=drop; sk.onkeyup=e=>{if(['ArrowLeft','ArrowRight','Home','End'].includes(e.key))drop()};
  }
  au.addEventListener('error',()=>toast('音源读取失败：确认文件在 audio/ 里且浏览器能解码该格式'));
}

/* ---------- 搜索 ---------- */
function norm(t){return (t||'').toLowerCase().replace(/[\s\u3000]+/g,'')}
function search(q){
  const k=norm(q), out=[];
  D.songs.forEach((s,i)=>{
    if(out.length>=60)return;
    const inName=norm(s.name).includes(k)||norm(s.album).includes(k);
    let hit=null;
    for(const l of s.lines){
      for(const key of ['org','rom','trans']){
        const v=l[key];
        if(v&&norm(v).includes(k)){hit={text:v,key};break}
      }
      if(hit)break;
    }
    if(inName||hit){
      const snip=hit?`<mark>${esc(hit.text)}</mark>`:`${esc(s.lines[0]?s.lines[0].org:'（无歌词文本）')}`;
      out.push({i,s,snip:snip.slice(0,180)});
    }
  });
  return out;
}

/* ---------- 通用 ---------- */
function fmt(t){const m=Math.floor(t/60),s=Math.floor(t%60);return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')}
function go(i){cur=(i+D.songs.length)%D.songs.length;view='song';location.hash='s'+song(cur).id;songView();window.scrollTo(0,0)}
function toggleFav(){const id=song(cur).id;FAV.has(id)?FAV.delete(id):FAV.add(id);save();songView();toast(FAV.has(id)?'已收藏':'已取消收藏')}
function copyLyric(){
  const s=song(cur);
  const txt=`${s.name} — ${s.album} (${s.date})\n\n`+s.lines.map(l=>[l.org,l.rom,l.trans].filter(Boolean).join('\n')).join('\n');
  const done=()=>toast('歌词已复制到剪贴板');
  if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(txt).then(done,()=>fallback());
  else fallback();
  function fallback(){const ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();
    try{document.execCommand('copy');done()}catch(e){toast('复制失败，可手动选择文本')}ta.remove()}
}
function sync(){
  document.documentElement.classList.toggle('dark',!!S.dark);
  document.documentElement.classList.toggle('no-ts',!S.ts);
  document.documentElement.style.setProperty('--fs',S.fs+'px');
  document.documentElement.style.setProperty('--lh',S.lh);
  document.getElementById('favN').textContent=FAV.size?'('+FAV.size+')':'';
  V().querySelectorAll('#segMode2 button').forEach(b=>b.classList.toggle('on',b.dataset.m===S.mode));
  ['cOrg|org','cRom|rom','cTrn|trn','cTs|ts','cAuto|auto','cImg|img'].forEach(p=>{
    const [id,k]=p.split('|');const e=document.getElementById(id);if(e)e.checked=S[k]});
  const fs=document.getElementById('fs'),lh=document.getElementById('lh');
  fs.value=S.fs;lh.value=S.lh;document.getElementById('fsVal').textContent=S.fs+'px';
  document.getElementById('lhVal').textContent=(+S.lh).toFixed(2);
}
function applyDrawer(){
  document.querySelectorAll('#segMode button').forEach(b=>b.classList.toggle('on',b.dataset.m===S.mode));
  document.querySelectorAll('#segLang button').forEach(b=>b.classList.toggle('on',b.dataset.l===S.lang));
}
document.querySelectorAll('#segMode button').forEach(b=>b.onclick=()=>{S.mode=b.dataset.m;save();sync();applyDrawer();rerender()});
document.querySelectorAll('#segLang button').forEach(b=>b.onclick=()=>{S.lang=b.dataset.l;save();applyDrawer();rerender()});
[['cOrg','org'],['cRom','rom'],['cTrn','trn'],['cTs','ts'],['cAuto','auto'],['cImg','img']].forEach(([id,k])=>{
  document.getElementById(id).onchange=e=>{S[k]=e.target.checked;save();sync();applyDrawer();rerender()}});
document.getElementById('fs').oninput=e=>{S.fs=+e.target.value;save();sync()};
document.getElementById('lh').oninput=e=>{S.lh=+e.target.value;save();sync()};
document.getElementById('bGear').onclick=()=>document.getElementById('drawer').classList.toggle('open');
document.getElementById('bTheme').onclick=()=>{S.dark=!S.dark;save();sync();toast(S.dark?'夜间':'日间')};
document.getElementById('bFav').onclick=()=>favView();
document.getElementById('brand').onclick=()=>{lastQuery='';home('')};
function rerender(){if(view==='song')songView();else home(lastQuery)}

document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT')return;
  const k=e.key;
  if(k==='/'){e.preventDefault();lastQuery='';home('');const q=document.getElementById('q');if(q)q.focus()}
  else if(k==='Escape'){lastQuery='';home('')}
  else if(view==='song'&&k==='ArrowLeft'){go(cur-1)}
  else if(view==='song'&&k==='ArrowRight'){go(cur+1)}
  else if(view==='song'&&k==='['){const a=albumOf(song(cur));const ids=a.songIds||[];go(byId(ids.find(id=>id<song(cur).id)??ids[ids.length-1]))}
  else if(view==='song'&&k===']'){const a=albumOf(song(cur));const ids=a.songIds||[];go(byId(ids.find(id=>id>song(cur).id)??ids[0]))}
  else if(view==='song'&&(k==='f'||k==='F')){toggleFav()}
  else if(view==='song'&&(k==='c'||k==='C')){copyLyric()}
  else if(view==='song'&&k===' '){const au=document.getElementById('au');if(au){e.preventDefault();au.paused?au.play():au.pause()}}
});

/* 音源清单：走 serve.py 的 /api/audio；直接双击打开 HTML 时静默降级 */
if(!D.static)fetch('/api/audio').then(r=>r.json()).then(m=>{audioMap=m||{};if(view==='song')songView()}).catch(()=>{});

const h=location.hash.match(/^#s(\d+)$/);
if(h&&byId(+h[1])>=0){cur=byId(+h[1]);view='song';songView()}else home('');
sync();applyDrawer();
</script>
